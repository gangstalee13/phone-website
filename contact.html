<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — iPhone Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><h1>iPhone Shop</h1></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Products</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link active">Contact</a>
      </nav>
      <div class="header-actions">
        <button id="cart-btn" class="button button-primary">Cart (<span id="cart-count">0</span>)</button>
        <a href="checkout.html" class="button button-primary">Checkout</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="hero-copy">
        <h2>Contact Us</h2>
        <p>Have questions? Send us a message and we'll get back to you.</p>
      </div>
    </section>

    <section style="padding:2rem;max-width:720px;margin:0 auto;">
      <div class="contact-actions" style="display:grid; gap:1rem;">
        <a class="button button-primary" href="https://wa.me/263785233384" target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Chat on WhatsApp
        </a>
        <a class="button button-outline" href="mailto:nyashazwandaziwah5@gmail.com">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-10 5L2 7"></path>
          </svg>
          Send an Email
        </a>
      </div>
    </section>
  </main>

  <div id="cart-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Your Cart</h2>
      <ul id="cart-list"></ul>
      <div class="cart-total">Total: $<span id="cart-total">0.00</span></div>
      <button id="checkout-btn">Checkout</button>
      <button id="close-cart">Close</button>
    </div>
  </div>

  <div id="checkout-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Checkout</h2>
      <form id="checkout-form">
        <label>Name<input name="name" required /></label>
        <label>Address<input name="address" required /></label>
        <label>Email<input name="email" type="email" required /></label>
        <button type="submit">Place Order (demo)</button>
      </form>
      <button id="close-checkout">Close</button>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded',()=>{
    const form = document.getElementById('contact-form');
    if(form) form.addEventListener('submit',e=>{e.preventDefault();alert('Message sent (demo)')});
  });
  </script>
  <script src="script.js" defer></script>
</body>
</html>
